# EA + ShallowConvNet (Schirrmeister et al. 2017) + Linear, trained with ERM.
# Network-axis comparison against EEGNet / DeepConvNet / EEGConformer.
#
# Note on reproducing the leaderboard cell: unlike the other stage tables, the
# Networks table selects a learning rate and training length per architecture on
# held-out source-validation data (see RESULTS.md, "Network (backbone)"), so the
# published number comes from `scripts/tune_networks.py`, not from the fixed
# values below. This preset is the canonical fixed-hyperparameter composition —
# use it to run the architecture, and `tune_networks.py --backbones ShallowConvNet`
# to reproduce the tuned cell.
aligner: EA
augmenter: Identity
backbone: ShallowConvNet
head: Linear
strategy: ERM
epochs: 100
batch_size: 32
lr: 0.001
