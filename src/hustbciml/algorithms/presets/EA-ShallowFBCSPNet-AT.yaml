# EA + ShallowFBCSPNet architecture transfer + shared Linear head, trained with ERM.
# Reportable Network results come only from the target-isolated nested tuner;
# these fixed values are a convenient non-reportable single-run composition.
aligner: EA
augmenter: Identity
backbone: ShallowFBCSPNetAT
head: Linear
strategy: ERM
epochs: 100
batch_size: 32
lr: 0.001
