ABAT:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · ABAT
  implementation: 'Adapted from github.com/xqchen914/ABAT (Chen et al. 2024); EEGNet''s MaxNorm weight
    constraint is omitted so that the adversarial training is the sole difference from ERM. See the upstream
    repository for its original license terms.

    '
  mechanism: 'Alignment-Based Adversarial Training, after a clean warmup, perturbs each batch with channel-standard-deviation-scaled
    projected gradient descent (PGD) and trains on the adversarial examples, hardening the decision boundary
    over the EA-aligned inputs. The only change from ERM is the adversarial inner loop, which keeps the
    strategy-axis comparison controlled.

    '
  paradigm: MI
  role: method
ASFA:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · ASFA
  implementation: 'Adapted from Xia et al. 2022 (IEEE TBME) onto the Strategy ABC. The paper''s backbone
    is a Riemannian tangent-space MLP; here the adaptation OBJECTIVE is ported onto EA-EEGNet so the comparison
    stays on the shared backbone (disclosed). SGD, lr 0.01, 10 epochs; no third-party code beyond the
    ported objective.

    '
  mechanism: 'ASFA is source-free adaptation: after ERM source training the classifier head is frozen
    and only the feature extractor is adapted on the unlabeled target, by reducing a Tsallis-entropy prediction-uncertainty
    objective (temperature rescale, per-instance entropy reweighting, per-class normalization) together
    with a consistency regularizer from a DropMin auxiliary head. No source data is kept at adapt time.

    '
  paradigm: MI
  role: method
BFT:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · BFT (test-time, no gradient)
  implementation: 'Adapted from Li et al. 2026 (arXiv:2601.07556). DISCLOSED APPROXIMATION: the paper''s
    learning-to-rank module is a ranking network r(.) plus a mapping network m(.) pre-trained on synthetic
    data with an L1 rank loss, following SoDeep differentiable sorting; the SoDeep sorter weights are
    not released. Here r(.) is the authors'' EEGNetLossPredictor (a 3-layer MLP on the flattened backbone
    features) trained on the source with a soft-rank Spearman surrogate over the K test-time views, and
    the aggregation weight per view is softmax(-predicted_loss) accumulated as a running mean over the
    stream. m(.) is not instantiated, because its output does not enter the aggregation. The backprop-free
    multi-transform structure, the predictor architecture, its inputs and its rank target are the authors'';
    the rank objective is a surrogate. The aggregation temperature is tau = 0.25 (config `bft_temp`);
    the paper uses 0.5.

    '
  mechanism: 'Backpropagation-Free Transformations (the BFT-A variant) pass each trial through K label-preserving
    transforms at test time and aggregate the predictions with a temperature-sharpened weighted softmax,
    with no gradient step. It adapts by test-time-augmentation aggregation rather than by updating parameters.

    '
  paradigm: MI
  role: method
BN-adapt:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · BNAdapt
  implementation: 'Refactored from the Nado et al. 2020 / Schneider et al. 2020 BN-adapt recipe onto the
    Strategy ABC; self-contained.

    '
  mechanism: 'BatchNorm adaptation re-estimates the BatchNorm statistics from the target stream — no gradient
    step and no parameter update — correcting covariate shift by re-normalizing the features with target
    statistics. Note the form: the BN layers are put in training mode and the sliding target batch is
    forwarded, so PyTorch folds the batch statistics into the running estimates by its momentum EMA rather
    than replacing them. The adapted statistics therefore still depend on the source BN state, the momentum
    and the stream order; a pure recompute-from-the-target-batch variant would set momentum to 1.0 and
    is a different measurement.

    '
  paradigm: MI
  role: method
CDAN:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · CDAN
  implementation: 'Ported from the authors'' reference implementation; the upstream reference implementation
    is MIT-licensed.

    '
  mechanism: 'Conditional Domain-Adversarial Network is DANN with the domain discriminator conditioned
    on the multilinear (outer-product) combination of feature and classifier prediction, so it aligns
    the joint feature-label distribution across domains rather than only the marginal feature distribution.

    '
  paradigm: MI
  role: method
CR-EEGNet:
  axis: augmentation
  baseline: NoAlign-EEGNet
  config: Identity (no alignment) · ChannelReflection · EEGNet · Linear · ERM
  delta: 3.88
  implementation: 'From-scratch (no lab source in the repository) with a montage left/right symmetry map;
    self-contained, carries the repository''s MIT license. Two-class motor imagery only.

    '
  mechanism: 'Channel Reflection augmentation mirrors each trial across the sagittal midline (a left/right
    electrode swap) and swaps the left/right motor-imagery label, doubling the training set with anatomically
    valid copies. Because it is an electrode-space transform it must precede any spatial whitening, so
    it is composed with the Identity aligner (its baseline is therefore the no-alignment control).

    '
  paradigm: MI
  role: method
CSDA-EEGNet:
  axis: augmentation
  baseline: EA-EEGNet
  config: EA · CSDA · EEGNet · Linear · ERM
  implementation: 'Adapted from github.com/wzwvv/CSDA (Ziwei Wang et al. 2025, Knowledge-Based Systems),
    the DWTaug variant only (HHTaug omitted); requires PyWavelets. See the upstream repository for its
    original license terms.

    '
  mechanism: 'Cross-Subject Detail-swap Augmentation applies a db4 discrete wavelet transform to split
    each EA-aligned trial into approximation and detail bands, then swaps the detail (high-frequency)
    coefficients between same-class trials from different subjects and reconstructs — synthesizing cross-subject
    variants that preserve class identity. Because a source batch spans many subjects, the same-class
    in-batch swap preserves the cross-subject mechanism under the LOSO contract.

    '
  paradigm: MI
  role: method
CSP-LDA:
  axis: classical
  config: EA · CSP spatial filters · (no backbone) · LDA · fit
  implementation: 'CSP from MNE and LDA from scikit-learn on the fit-mode Strategy and Head ABCs; both
    are standard BSD-3 libraries.

    '
  mechanism: 'Common Spatial Patterns plus Linear Discriminant Analysis. CSP learns spatial filters that
    maximize the band-power variance ratio between the two motor-imagery classes on the EA-aligned trials;
    the log-variance features feed an LDA classifier. The classic MI pipeline — network-free and deterministic
    — and it beats the deep EA-EEGNet reference on this dataset.

    '
  paradigm: MI
  reference: EA-EEGNet
  role: reference
CSP-Net:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · CSPNet · Linear · ERM
  implementation: 'Adapted from github.com/jxgogo/CSP-Net (Jiang et al. 2024, Knowledge-Based Systems)
    onto the Backbone ABC as CSP-Net-2-fix: the depthwise spatial-conv weights are overwritten with mne
    CSP filters (average-power, epoch covariance) computed by a data-dependent init hook on the training
    split, then frozen; the eight CSP filters are tiled to fill the spatial-conv output channels, matching
    the source. CSP-Net-1 (a prepended CSP layer) is the non-default variant. See the upstream repository
    for its original license terms.

    '
  mechanism: 'A standard EEGNet whose depthwise spatial convolution is initialized with Common Spatial
    Pattern filters estimated from the EA-aligned source data and then frozen — the CSP-Net-2 configuration
    — so the spatial layer is the CSP solution while the temporal and separable convolutions train normally.
    It injects classical, well-understood CSP spatial filtering into the network as a structural prior,
    and leads the backbone axis.

    '
  paradigm: MI
  role: method
DAN:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · DAN
  implementation: 'Ported from the authors'' reference implementation; the upstream reference implementation
    is MIT-licensed.

    '
  mechanism: 'Deep Adaptation Network matches source and target feature distributions by minimizing a
    multi-kernel Maximum Mean Discrepancy (MK-MMD) on the backbone''s higher layers, added to the source
    classification loss.

    '
  paradigm: MI
  role: method
DELTA:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · DELTA
  implementation: 'Ported from DeepTransferEEG tl/delta.py (lab repository, same author); no third-party
    code.

    '
  mechanism: 'DELTA performs entropy minimization with a class-imbalance-corrected diversity term (dynamic
    online reweighting of classes), which prevents the collapse to majority-class predictions that degrades
    naive test-time adaptation.

    '
  paradigm: MI
  role: method
DJP-MMD:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · DJPMMD
  implementation: 'Adapted from github.com/chamwen/DaNN_DJP (Zhang & Wu, IJCNN 2020) onto the transductive
    Strategy ABC; the paper''s DJP-MMD loss (mu = 0.1) is applied to EEGNet features. The paper benchmarks
    only image domains, so this is a faithful adaptation of the loss to EEG (see the note) — no third-party
    code beyond the ported loss.

    '
  mechanism: 'Discriminative Joint Probability Maximum Mean Discrepancy adds a discrepancy over the joint
    P(X, Y) — using source labels and target pseudo-labels — that increases between-class transfer distance
    while decreasing within-class distance, added to the source cross-entropy and trained transductively
    (the unlabeled target is used during source training). It is the same gradient domain-adaptation family
    as DAN, JAN and MDD.

    '
  paradigm: MI
  role: method
EA-ADFCNN:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · ADFCNN · Linear · ERM
  implementation: 'Ported from the authors'' implementation (https://github.com/UM-Tao/ADFCNN-MI) onto
    the Backbone ABC: the classification head is dropped so the shared Linear head produces the logits,
    and the feature width is measured by a construction-time dummy forward so the same file runs on any
    (channels, samples) dataset. Deviations are listed in the module docstring of src/hustbciml/algorithms/models/ADFCNN.py;
    see it before quoting this row against the paper''s own number.

    '
  mechanism: 'Two parallel spectral-spatial pathways at different temporal scales, fused by a self-attention
    module.

    '
  paradigm: MI
  role: method
EA-CTNet:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · CTNet · Linear · ERM
  implementation: 'Ported from the authors'' implementation (https://github.com/snailpt/CTNet) onto the
    Backbone ABC: the classification head is dropped so the shared Linear head produces the logits, and
    the feature width is measured by a construction-time dummy forward so the same file runs on any (channels,
    samples) dataset. Deviations are listed in the module docstring of src/hustbciml/algorithms/models/CTNet.py;
    see it before quoting this row against the paper''s own number.

    '
  mechanism: 'An EEGNet-style convolutional patch embedding feeding a transformer encoder.

    '
  paradigm: MI
  role: method
EA-DANN:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · DANN
  implementation: 'Refactored from DeepTransferEEG (lab repository, same author) onto the Strategy ABC;
    no third-party code.

    '
  mechanism: 'Domain-Adversarial Neural Network trains a domain classifier to separate source from unlabeled-target
    features while a gradient-reversal layer forces the backbone to produce domain-invariant features.
    It is transductive: the unlabeled target is used during source training.

    '
  paradigm: MI
  role: method
EA-DBConformer:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · DBConformer · Linear · ERM
  implementation: 'Adapted from github.com/wzwvv/DBConformer (Ziwei Wang et al. 2025) onto the Backbone
    ABC, using the paper''s default all-branch configuration (channel attention and positional embeddings
    on); the single-branch and gated-fusion variants are omitted. See the upstream repository for its
    original license terms.

    '
  mechanism: 'A dual-branch convolutional transformer. A temporal branch and a spatial branch each tokenize
    the EA-aligned trial with convolutions, add positional embeddings, and pass the tokens through a multi-head
    self-attention encoder; channel-attention pooling then fuses the two branches before the linear head.
    It combines convolutional locality with transformer global context, and leads the backbone axis.

    '
  paradigm: MI
  role: method
EA-DeepConvNet:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · DeepConvNet · Linear · ERM
  implementation: 'Refactored from the Schirrmeister et al. 2017 architecture onto the Backbone ABC; self-contained,
    no third-party code vendored.

    '
  mechanism: 'DeepConvNet stacks four temporal/spatial convolution-plus-pooling blocks — deeper and higher-capacity
    than EEGNet — trained end-to-end on the EA-aligned trials with a linear head. It stays fully convolutional;
    the extra depth edges it past EEGNet on this dataset.

    '
  paradigm: MI
  role: method
EA-EEGConformer:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · EEGConformer · Linear · ERM
  implementation: 'From-scratch implementation (no lab source in the repository) on the Backbone ABC;
    self-contained, carries the repository''s MIT license.

    '
  mechanism: 'EEG Conformer is a convolutional tokenizer (temporal then spatial convolution producing
    patch tokens) feeding a transformer self-attention encoder and an MLP head, on EA-aligned trials.
    On this benchmark''s three-dataset production run it lands slightly above the EA-EEGNet baseline with
    a small across-seed spread.

    '
  paradigm: MI
  role: method
EA-EEGDeformer:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · EEGDeformer · Linear · ERM
  implementation: 'Ported from the authors'' implementation (https://github.com/yi-ding-cs/EEG-Deformer)
    onto the Backbone ABC: the classification head is dropped so the shared Linear head produces the logits,
    and the feature width is measured by a construction-time dummy forward so the same file runs on any
    (channels, samples) dataset. Deviations are listed in the module docstring of src/hustbciml/algorithms/models/EEGDeformer.py;
    see it before quoting this row against the paper''s own number.

    '
  mechanism: 'A dense convolutional transformer that interleaves shallow CNN encoders with coarse-to-fine
    transformer stages.

    '
  paradigm: MI
  role: method
EA-EEGNeX:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNeX · Linear · ERM
  implementation: 'Ported from the authors'' implementation (https://github.com/chenxiachan/EEGNeX) onto
    the Backbone ABC: the classification head is dropped so the shared Linear head produces the logits,
    and the feature width is measured by a construction-time dummy forward so the same file runs on any
    (channels, samples) dataset. Deviations are listed in the module docstring of src/hustbciml/algorithms/models/EEGNeX.py;
    see it before quoting this row against the paper''s own number.

    '
  mechanism: 'A purely convolutional EEGNet variant that replaces the separable temporal convolutions
    with a stack of dilated convolutions for a wider receptive field.

    '
  paradigm: MI
  role: method
EA-EEGNet:
  axis: canonical
  config: EA · no-aug · EEGNet · Linear · ERM
  implementation: 'Euclidean Alignment and EEGNet refactored from DeepTransferEEG (the lab''s own repository,
    same author) onto the Aligner and Backbone ABCs; no third-party code vendored.

    '
  mechanism: 'Euclidean Alignment recenters each subject''s trials by the inverse square root of their
    mean spatial covariance, so every subject shares a common whitened reference frame; EEGNet — a compact
    depthwise-separable temporal then spatial CNN — classifies the aligned trials with a linear head under
    ordinary empirical risk minimization. This is the canonical composition, the reference every controlled
    single-axis delta in the benchmark is measured against.

    '
  paradigm: MI
  role: base
EA-EEGWaveNet:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · EEGWaveNet · Linear · ERM
  implementation: 'Ported from the authors'' implementation (https://github.com/IoBT-VISTEC/EEGWaveNet)
    onto the Backbone ABC: the classification head is dropped so the shared Linear head produces the logits,
    and the feature width is measured by a construction-time dummy forward so the same file runs on any
    (channels, samples) dataset. Deviations are listed in the module docstring of src/hustbciml/algorithms/models/EEGWaveNet.py;
    see it before quoting this row against the paper''s own number.

    '
  mechanism: 'A cascade of depthwise Conv1d layers repeatedly halves the sampling rate to extract multiscale
    temporal features; originally a seizure detector.

    '
  paradigm: MI
  role: method
EA-FBMSNet:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · FBMSNet · Linear · ERM
  implementation: 'Ported from the authors'' implementation (https://github.com/Want2Vanish/FBMSNet) onto
    the Backbone ABC: the classification head is dropped so the shared Linear head produces the logits,
    and the feature width is measured by a construction-time dummy forward so the same file runs on any
    (channels, samples) dataset. Deviations are listed in the module docstring of src/hustbciml/algorithms/models/FBMSNet.py;
    see it before quoting this row against the paper''s own number.

    '
  mechanism: 'Decomposes the signal into a filter bank of narrow sub-bands, then applies mixed-scale depthwise
    temporal convolutions.

    '
  paradigm: MI
  role: method
EA-KDFNet:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · KDFNet · Linear · ERM
  implementation: 'Adapted from Jiang et al. 2026 (Information Sciences) onto the Backbone ABC: windowed-sinc
    filter-bank init (data-free) and per-band CSP spatial init (data-dependent, on the training split),
    fine-tuned end-to-end. The paper''s head learning-rate init is omitted (the linear head trains from
    scratch, documented). See the upstream repository for its original license terms.

    '
  mechanism: 'KDFNet (knowledge-data fusion network) mirrors the FBCSP pipeline inside a CNN: a windowed-sinc
    FIR filter bank supplies fixed, data-free band-pass temporal filters, per-band Common Spatial Pattern
    filters estimated on the EA-aligned source initialize the spatial layer, and log-variance features
    feed the head — then the whole network is fine-tuned end-to-end. It fuses classical FBCSP prior knowledge
    with data-driven training.

    '
  paradigm: MI
  role: method
EA-MSCFormer:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · MSCFormer · Linear · ERM
  implementation: 'Ported from the authors'' implementation (not) onto the Backbone ABC: the classification
    head is dropped so the shared Linear head produces the logits, and the feature width is measured by
    a construction-time dummy forward so the same file runs on any (channels, samples) dataset. Deviations
    are listed in the module docstring of src/hustbciml/algorithms/models/MSCFormer.py; see it before quoting
    this row against the paper''s own number.

    '
  mechanism: 'Three parallel multi-scale temporal-convolution branches whose features are fused and passed
    to a transformer encoder.

    '
  paradigm: MI
  role: method
EA-MSVTNet:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · MSVTNet · Linear · ERM
  implementation: 'Ported from the authors'' implementation (https://github.com/SheldonLiu0412/MSVTNet)
    onto the Backbone ABC: the classification head is dropped so the shared Linear head produces the logits,
    and the feature width is measured by a construction-time dummy forward so the same file runs on any
    (channels, samples) dataset. Deviations are listed in the module docstring of src/hustbciml/algorithms/models/MSVTNet.py;
    see it before quoting this row against the paper''s own number.

    '
  mechanism: 'Several parallel multi-scale EEGNet-style convolution branches followed by a transformer
    that mixes their tokens.

    '
  paradigm: MI
  role: method
EA-ShallowConvNet:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · ShallowConvNet · Linear · ERM
  implementation: 'Refactored from Schirrmeister et al. 2017 onto the Backbone ABC; self-contained.

    '
  mechanism: 'ShallowConvNet is a single temporal convolution followed by a spatial convolution, a square
    activation, mean pooling and a log — the FBCSP-style band-power pipeline made differentiable — on
    EA-aligned trials. Deliberately shallow and tuned for the oscillatory band-power that carries motor
    imagery.

    '
  paradigm: MI
  role: method
EA-SlimSeiz:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · SlimSeiz · Linear · ERM
  implementation: 'Ported from the authors'' implementation (https://github.com/guoruilu/SlimSeiz) onto
    the Backbone ABC: the classification head is dropped so the shared Linear head produces the logits,
    and the feature width is measured by a construction-time dummy forward so the same file runs on any
    (channels, samples) dataset. Deviations are listed in the module docstring of src/hustbciml/algorithms/models/SlimSeiz.py;
    see it before quoting this row against the paper''s own number.

    '
  mechanism: 'A lightweight multi-branch 1D-convolution feature extractor paired with a single Mamba selective-state-space
    mixer; originally a seizure-prediction network.

    '
  paradigm: MI
  role: method
EA-TIEEEGNet:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · TIEEEGNet · Linear · ERM
  implementation: 'Refactored from Peng et al. 2022 (IEEE TNSRE) onto the Backbone ABC. The paper targets
    seizure subtype classification; here the architecture is evaluated on the same EA + ERM motor-imagery
    setup as the other backbones, at the benchmark EEGNet capacity (F1 4 / F2 8; the paper''s F1 8 / F2
    16 is the reference config). See the upstream repository for its original license terms.

    '
  mechanism: 'TIE-EEGNet is EEGNet with its first temporal convolution replaced by a time-information-enhanced
    (TIE) convolution: a fixed sinusoidal time-positional embedding is added to the trial before temporal
    filtering, injecting explicit within-trial timing information that plain EEGNet lacks. Everything
    downstream — the depthwise spatial convolution, separable convolution and linear head — is unchanged,
    so it is a controlled one-block change to the backbone. Caveat (domain fit): TIE-EEGNet was developed
    for seizure subtype classification, not motor imagery — its time-positional design targets seizure
    EEG and may not be well-suited to MI, consistent with it only matching the EEGNet baseline here.

    '
  paradigm: MI
  role: method
EA-TMSANet:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · no-aug · TMSANet · Linear · ERM
  implementation: 'Ported from the authors'' implementation (not) onto the Backbone ABC: the classification
    head is dropped so the shared Linear head produces the logits, and the feature width is measured by
    a construction-time dummy forward so the same file runs on any (channels, samples) dataset. Deviations
    are listed in the module docstring of src/hustbciml/algorithms/models/TMSANet.py; see it before quoting
    this row against the paper''s own number.

    '
  mechanism: 'Sums two parallel multi-scale temporal convolutions, then applies a temporal multi-scale
    self-attention module.

    '
  paradigm: MI
  role: method
FComb-EEGNet:
  axis: augmentation
  config: EA · FComb · EEGNet · Linear · ERM
  implementation: 'Implemented directly from the cited paper against the Augmenter ABC (src/hustbciml/algorithms/augmenters/);
    no third-party code vendored. The augmenter is the only stage that differs from the EA-EEGNet baseline.

    '
  mechanism: 'Splits each trial''s cosine spectrum into contiguous bands and rebuilds a new trial by taking
    each band from a different same-class trial.

    '
  paradigm: MI
  role: method
FShift-EEGNet:
  axis: augmentation
  config: EA · FShift · EEGNet · Linear · ERM
  implementation: 'Implemented directly from the cited paper against the Augmenter ABC (src/hustbciml/algorithms/augmenters/);
    no third-party code vendored. The augmenter is the only stage that differs from the EA-EEGNet baseline.

    '
  mechanism: 'Translates a trial''s whole spectrum by a small frequency offset using the analytic (Hilbert)
    signal.

    '
  paradigm: MI
  role: method
FSurr-EEGNet:
  axis: augmentation
  config: EA · FSurr · EEGNet · Linear · ERM
  implementation: 'Implemented directly from the cited paper against the Augmenter ABC (src/hustbciml/algorithms/augmenters/);
    no third-party code vendored. The augmenter is the only stage that differs from the EA-EEGNet baseline.

    '
  mechanism: 'Draws a surrogate trial with the same power spectrum as the original but randomized Fourier
    phase.

    '
  paradigm: MI
  role: method
FedAvg:
  axis: strategy
  config: EA · no-aug · EEGNet · Linear · FedAvg
  implementation: 'Implemented against the Strategy ABC in src/hustbciml/algorithms/strategies/; the federated
    protocol is simulated in a single process (see the _fed.py docstring for what that does and does not
    demonstrate).

    '
  mechanism: 'Federated averaging: each subject trains locally and the server averages the model weights.
    It is the vanilla federated baseline that isolates FedBS''s two additions.

    '
  paradigm: MI
  role: method
FedBS:
  axis: strategy
  config: EA · no-aug · EEGNet · Linear · FedBS
  implementation: 'Implemented against the Strategy ABC in src/hustbciml/algorithms/strategies/; the federated
    protocol is simulated in a single process (see the _fed.py docstring for what that does and does not
    demonstrate).

    '
  mechanism: 'Federated learning with batch-specific BatchNorm and sharpness-aware minimization, aggregating
    per-subject model updates through a server without sharing raw EEG. Under the same optimizer and learning
    rate as Centralized Training it recovers essentially all of the centralized accuracy, so privacy is
    nearly free here.

    '
  paradigm: MI
  role: method
Flip-EEGNet:
  axis: augmentation
  config: EA · Flip · EEGNet · Linear · ERM
  implementation: 'Implemented directly from the cited paper against the Augmenter ABC (src/hustbciml/algorithms/augmenters/);
    no third-party code vendored. The augmenter is the only stage that differs from the EA-EEGNet baseline.

    '
  mechanism: 'Mirrors each channel vertically about its own maximum, adding one label-preserving copy
    per trial.

    '
  paradigm: MI
  role: method
HS-EEGNet:
  axis: augmentation
  config: Identity · HS · EEGNet · Linear · ERM
  implementation: 'Implemented directly from the cited paper against the Augmenter ABC (src/hustbciml/algorithms/augmenters/);
    no third-party code vendored. The augmenter is the only stage that differs from the EA-EEGNet baseline.

    '
  mechanism: 'Splices the left- and right-hemisphere channels from two same-class trials into a new trial,
    exploiting motor-imagery lateralization. An electrode-space transform, run on unaligned trials.

    '
  paradigm: MI
  role: method
ISFDA:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · ISFDA
  implementation: 'Ported from DeepTransferEEG tl/isfda.py (lab repository), online test-time variant;
    no third-party code.

    '
  mechanism: 'Imbalanced Source-Free Domain Adaptation combines temperature-scaled information maximization
    with intra-class feature tightening and inter-class separation on pseudo-labeled target features,
    designed to stay robust under class imbalance. It shows no per-subject collapse here.

    '
  paradigm: MI
  role: method
JAN:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · JAN
  implementation: 'Ported from the authors'' reference implementation; the upstream reference implementation
    is MIT-licensed.

    '
  mechanism: 'Joint Adaptation Network extends the MMD idea by aligning the joint distribution across
    multiple layers (feature and softmax) with a joint Maximum Mean Discrepancy, rather than matching
    each layer''s marginal separately. One of the tightest-variance strategies here.

    '
  paradigm: MI
  role: method
LSFT:
  axis: classical
  config: own RA · tangent-space features · (no backbone) · LDA+LR voting + DJP-MMD adaptation · fit
  implementation: 'Adapted from github.com/chamwen/LSFT (Zhang & Wu, IEEE TCDS 2022), the CA+LSFT (shrinkage-LDA
    + logistic-regression voting) configuration, onto the fit-mode Strategy ABC: fit trains the source
    voters and discards source raw data (source-free); predict does the voting, virtual-source selection,
    and iterative feature adaptation on the target. LSFT does its own Riemannian centroid alignment, so
    the preset aligner is Identity. Minimal disclosed guards cover degenerate virtual-source selection.
    Requires pyriemann + scikit-learn.

    '
  mechanism: 'Lightweight Source-Free Transfer keeps no raw source data at transfer time: pretrained source
    classifiers vote to pseudo-label the target, the confident (low-disagreement) target trials form a
    virtual intermediate source, and an iterative DJP-MMD subspace adaptation with pseudo-label refinement
    produces the final target predictions. Everything runs on classical Riemannian tangent-space features;
    it is transductive (it adapts to the unlabeled target), which distinguishes it from the no-transfer
    classical baselines.

    '
  paradigm: MI
  reference: EA-EEGNet
  role: method
MCC:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · MCC
  implementation: 'Ported from the authors'' reference implementation onto the Strategy ABC; the upstream
    reference implementation is MIT-licensed.

    '
  mechanism: 'Minimum Class Confusion adds a loss that minimizes the off-diagonal class-confusion of the
    temperature-rescaled prediction correlation on the unlabeled target, discouraging ambiguous cross-class
    predictions. It is not adversarial — a single confusion penalty on the target — and it leads the entire
    benchmark here.

    '
  paradigm: MI
  role: method
MDD:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · MDD
  implementation: 'Ported from the authors'' reference implementation with the gradient-reversal step
    restored; the upstream reference implementation is MIT-licensed.

    '
  mechanism: 'Margin Disparity Discrepancy bounds the target error by a margin-based disparity between
    the main classifier and an adversarial auxiliary classifier, minimized through a gradient-reversal
    step. It has the tightest across-seed variance in the whole sweep.

    '
  paradigm: MI
  role: method
MDMAML:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · MDMAML
  implementation: 'Adapted from Li et al. 2022 (IEEE Computational Intelligence Magazine) onto the Strategy
    ABC. First-order MAML with an Adam meta-optimizer for the outer loop (a plain-SGD outer loop under-trained
    EEGNet to near chance; the Adam meta-optimizer is the fix). Many meta-updates per epoch (steps = mean-domain-length
    // batch). No third-party code beyond the ported meta-loop.

    '
  mechanism: 'MDMAML meta-learns an EEGNet initialization across the source subjects with domain-paired
    first-order model-agnostic meta-learning (MAML): each episode pairs source domains (M/2 pairs), takes
    one inner adaptation step on one domain and a meta-update from the other, so the learned weights transfer
    quickly across subjects. At test time the meta-trained network is applied to the target directly,
    with no target fine-tuning (forward-only) — a privacy-preserving transfer that never touches target
    data during training.

    '
  paradigm: MI
  role: method
MEKT:
  axis: classical
  config: own CA · tangent-space features · (no backbone) · shrinkage-LDA · fit
  implementation: 'Adapted from Zhang & Wu 2020 (IEEE TNSRE) onto the fit-mode Strategy ABC: pyriemann
    for the covariance and tangent map, scikit-learn shrinkage-LDA, and the Sec-III-C projection ported
    from the authors'' code (chamwen/MEKT) via TBC-TJU/MetaBCI''s mekt_kernel (MIT), with per-subject
    source CA. MEKT does its own centroid alignment, so the preset aligner is Identity; target features
    are only ever unlabeled (pseudo-labels come from the classifier, never target labels). Projection
    hyperparameters (subspace dim, alpha/beta/rho, iterations) default to the MetaBCI reference and are
    overridable via ctx.cfg.hp. Requires pyriemann + scikit-learn + scipy.

    '
  mechanism: 'Manifold Embedded Knowledge Transfer is a network-free classical transfer method. Each subject''s
    trial covariances are centroid-aligned (CA) and mapped to Riemannian tangent-space feature vectors
    (source subjects pooled). A low-dimensional domain-adaptation projection is then learned jointly for
    source and target — minimizing the joint-probability distribution shift while preserving source discriminability
    and target locality, coupled so the two projections stay close — solved as a generalized eigenproblem
    with EM pseudo-label refinement. A shrinkage-LDA on the projected features classifies the target.
    Deterministic across seeds.

    '
  paradigm: MI
  reference: EA-EEGNet
  role: method
MSDT:
  axis: classical
  config: own tangent map · tangent-space features · (no backbone) · per-source MLP + IM adaptation ·
    fit
  implementation: 'Adapted from github.com/chamwen/MSDT (Zhang, Wang & Wu, IEEE TNSRE 2022), the gray-box
    MSDT-G variant, onto the fit-mode Strategy ABC. Per the LOSO protocol each other subject is one source
    domain. The upstream mixup is a no-op in the authors'' code (its gradients are wiped before the optimizer
    step) and is omitted here — reproducing the effective optimization, not "fixing" it (disclosed). Made
    device-agnostic; the tangent map is the only alignment, so the preset aligner is Identity. Requires
    pyriemann + scikit-learn.

    '
  mechanism: 'Multi-Source Decentralized Transfer trains one small MLP per source subject on Riemannian
    tangent-space features (decentralized — no source data is pooled). At transfer time only the source
    models are shared: the target adapts each source feature extractor (classifiers frozen) by information
    maximization — minimize per-instance entropy, maximize batch diversity — plus a source-inconsistency
    term that pulls the sources into agreement, with entropy-based per-source domain weighting; the prediction
    is the domain-weighted ensemble. It is multi-source and source-free.

    '
  paradigm: MI
  reference: EA-EEGNet
  role: method
MVCNet:
  axis: backbone
  baseline: EA-EEGNet
  config: EA · multi-view aug · IFNet · Linear · MVCNet (CVC + CMC contrastive)
  implementation: 'Adapted from github.com/wzwvv/MVCNet (Wang et al. 2025, Knowledge-Based Systems) with
    the IFNet backbone (Wang et al. 2023, IEEE TNSRE); the contrastive loss weights lamda1 and lamda2
    are set to 1.0 (no hardcoded default upstream). See the upstream repository for its original license
    terms.

    '
  mechanism: 'Multi-View Contrastive Network is a composite algorithm: it pairs an IFNet backbone (an
    interactive frequency-domain CNN) with multi-view training — several augmented views per trial supervised
    by cross-view (CVC) and cross-modal (CMC) supervised-contrastive losses alongside classification.
    At inference only IFNet and the linear head run. Because it changes more than one stage it is not
    a single-axis controlled row; it is shown against the reference as a context number.

    '
  paradigm: MI
  role: method
NoAlign-EEGNet:
  axis: alignment
  config: Identity (no alignment) · no-aug · EEGNet · Linear · ERM
  implementation: 'Identity aligner plus EEGNet; no third-party code.

    '
  mechanism: 'The no-alignment control: identical to the canonical composition but with the aligner replaced
    by Identity, so EEGNet sees raw per-subject trials. It isolates the contribution of Euclidean Alignment,
    and is the baseline for the Channel-Reflection augmentation table because that transform is an electrode-space
    operation and must run before any spatial whitening.

    '
  paradigm: MI
  role: control
Noise-EEGNet:
  axis: augmentation
  config: EA · Noise · EEGNet · Linear · ERM
  implementation: 'Implemented directly from the cited paper against the Augmenter ABC (src/hustbciml/algorithms/augmenters/);
    no third-party code vendored. The augmenter is the only stage that differs from the EA-EEGNet baseline.

    '
  mechanism: 'Copies each trial once with zero-mean Gaussian noise added, scaled to the trial''s own amplitude;
    the simplest label-preserving augmentation.

    '
  paradigm: MI
  role: method
PAT:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · Scaling · EEGNet · Linear · PAT
  implementation: 'Adapted from github.com/xqchen914/PAT (Chen et al., Fundamental Research 2026, CC BY).
    Only the benign-accuracy training strategy is ported, on par with ABAT; the paper''s full federated
    / robustness protocol and its five-dataset, three-scenario evaluation are out of scope for this single-axis
    row. EEGNet''s MaxNorm constraint is omitted so the augmentation and adversarial training are the
    sole difference from ERM. See the upstream repository for its license terms.

    '
  mechanism: 'Privacy-preserving Adversarial Transfer extends ABAT: after a clean warmup, each Euclidean-aligned
    batch is first amplitude-scaled (multiplied by 1±0.05) and then perturbed by a global-epsilon L∞ projected
    gradient descent (PGD) attack with a noisy uniform initialization (eps 0.03, alpha 0.005, 10 steps),
    training on the adversarial examples. The target is never used, so training stays source-only — the
    sense in which it is privacy-preserving — and the only change from ERM is the augmentation-plus-adversarial
    inner loop.

    '
  paradigm: MI
  role: method
PL:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · PL
  implementation: 'Ported from DeepTransferEEG tl/pl.py (lab repository); no third-party code.

    '
  mechanism: 'Pseudo-Label self-training at test time turns the model''s own argmax predictions on target
    trials into training targets for a few online gradient steps — simple confirmation-based adaptation.
    Every trial in the sliding batch contributes: there is no confidence threshold, so ambiguous trials
    are trained on as if they were labelled, which is the confirmation-bias risk in its unfiltered form.

    '
  paradigm: MI
  role: method
RA-EEGNet:
  axis: alignment
  baseline: NoAlign-EEGNet
  config: RA · no-aug · EEGNet · Linear · ERM
  implementation: 'From-scratch (no lab source and no pyriemann dependency); the Fréchet mean is computed
    self-contained on the Aligner ABC.

    '
  mechanism: 'Riemannian Alignment recenters each subject by the affine-invariant (Fréchet) geometric
    mean of their trial covariances instead of Euclidean Alignment''s arithmetic mean, whitening on the
    SPD manifold before EEGNet. It is the best aligner here — a marginally better reference than the arithmetic
    mean.

    '
  paradigm: MI
  role: method
Riemann-MDM:
  axis: classical
  config: EA · covariance · (no backbone) · MDM · fit
  implementation: 'Uses pyriemann on the fit-mode ABCs; a standard BSD-3 library.

    '
  mechanism: 'Minimum Distance to Riemannian Mean represents each trial by its spatial covariance matrix
    and classifies by the smallest affine-invariant Riemannian distance to each class''s geometric-mean
    covariance. Network-free and deterministic.

    '
  paradigm: MI
  reference: EA-EEGNet
  role: reference
SAFE:
  axis: strategy
  config: EA · no-aug · EEGNet · Linear · SAFE
  implementation: 'Implemented against the Strategy ABC in src/hustbciml/algorithms/strategies/; the federated
    protocol is simulated in a single process (see the _fed.py docstring for what that does and does not
    demonstrate).

    '
  mechanism: 'Federated learning that adds single-step adversarial feature training and a one-step adversarial
    weight perturbation on top of batch-specific BatchNorm, hardening the shared model without pooling
    raw EEG. The adversarial regularization costs a little clean accuracy on BNCI2014001 but lifts the
    other two datasets clearly above centralized training.

    '
  paradigm: MI
  role: method
SAR:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · SAR
  implementation: 'Ported from DeepTransferEEG tl/sar.py (lab repository). The reliable-sample filter
    and model-recovery of the full SAR are omitted (disclosed); no third-party code.

    '
  mechanism: 'Sharpness-Aware and Reliable test-time adaptation minimizes temperature-scaled prediction
    entropy over all parameters using a Sharpness-Aware Minimization (SAM) two-step update, so adaptation
    seeks a flat, stable minimum robust to noisy target batches.

    '
  paradigm: MI
  role: method
SHOT:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · SHOT
  implementation: 'Ported from DeepTransferEEG tl/shot.py (lab repository), the information-maximization
    variant; no third-party code.

    '
  mechanism: 'Source Hypothesis Transfer is source-free: the source classifier head is frozen and only
    the feature extractor is adapted on the target, with no access to source data at adapt time. This
    is the information-maximization variant (SHOT-IM) — conditional-entropy minimization plus marginal-diversity
    maximization. The paper''s third term, self-supervised pseudo-labelling from target cluster centroids,
    is not implemented here, so the row is SHOT-IM rather than full SHOT. It ties ABAT here.

    '
  paradigm: MI
  role: method
Scale-EEGNet:
  axis: augmentation
  config: EA · Scaling · EEGNet · Linear · ERM
  implementation: 'Implemented directly from the cited paper against the Augmenter ABC (src/hustbciml/algorithms/augmenters/);
    no third-party code vendored. The augmenter is the only stage that differs from the EA-EEGNet baseline.

    '
  mechanism: 'Copies each trial with its amplitude multiplied by a coefficient close to one; the augmentation
    half of the PAT pipeline.

    '
  paradigm: MI
  role: method
T-TIME:
  axis: strategy
  baseline: EA-EEGNet
  config: online-EA · no-aug · EEGNet · Linear · TTIME
  delta: 3.99
  implementation: 'Refactored from DeepTransferEEG (the T-TIME paper''s own code, same author) onto the
    tta-mode Strategy ABC; no third-party code.

    '
  mechanism: 'Test-Time Information Maximization for online motor imagery: the source-trained model adapts
    on the streaming target by minimizing prediction entropy while maximizing marginal-class diversity
    (an information-maximization loss), with online incremental Euclidean Alignment updating the reference
    as each trial arrives. It has the tightest across-seed variance of the strong strategies; a 5-seed
    prediction ensemble lifts it further (see the Multi-seed ensemble section of RESULTS.md).

    '
  paradigm: MI
  role: method
Tent:
  axis: strategy
  baseline: EA-EEGNet
  config: EA · no-aug · EEGNet · Linear · Tent
  implementation: 'Ported from DeepTransferEEG''s test-time-adaptation baselines (lab repository); no
    third-party code.

    '
  mechanism: 'Test-time entropy minimization updates only the BatchNorm affine parameters on the target
    stream to minimize prediction entropy, leaving all other weights frozen — the lightest test-time-adaptation
    baseline. It sits at the ERM baseline here, as expected for an entropy-only, BN-parameter method.

    '
  paradigm: MI
  role: method
