<!DOCTYPE html>
<html lang="en" data-title-en="HUST BCIML: EEG-Decoding Benchmark &amp; Paper-to-Code Gallery">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HUST BCIML: EEG-Decoding Benchmark &amp; Paper-to-Code Gallery</title>
  <meta name="description" data-en="Brain-Computer Interface &amp; Machine Learning Laboratory (Prof. Dongrui Wu, HUST): the lab's open-source code home, holding a unified EEG-decoding benchmark and a paper-to-code gallery." content="Brain-Computer Interface & Machine Learning Laboratory (Prof. Dongrui Wu, HUST): the lab's open-source code home, holding a unified EEG-decoding benchmark and a paper-to-code gallery.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#overview" id="brand">HUST BCIML</a>
    <!-- role="tablist": the nav is visually a tab set, so assistive technology
         should get the same selected-tab information the layout gives sighted users.
         aria-selected is kept in step by activate() in app.js. -->
    <nav class="tabs" id="tabs" role="tablist">
      <button class="tab active" data-view="overview" role="tab" aria-selected="true" aria-controls="overview">Overview</button>
      <button class="tab" data-view="benchmark" role="tab" aria-selected="false" aria-controls="benchmark">Benchmark</button>
      <button class="tab" data-view="papers" role="tab" aria-selected="false" aria-controls="papers">Papers &amp; Code</button>
    </nav>
    <div class="header-links" id="header-links"></div>
  </header>

  <main>
    <section id="overview" class="view active"></section>
    <section id="benchmark" class="view"></section>
    <section id="papers" class="view"></section>
  </main>

  <footer class="site-footer" id="footer"></footer>

  <!-- data is inlined (window.LAB / PUBLICATIONS / BENCHMARK) so this page opens
       directly as a local file with no server, and unchanged on GitHub Pages. -->
  <script src="data/lab.js"></script>
  <script src="data/publications.js"></script>
  <script src="data/benchmark.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
