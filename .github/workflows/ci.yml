name: CI

# Nothing previously ran on push or pull request: the smoke suite executed only
# when a developer remembered to invoke pytest, and the generated web data could
# drift from its YAML source with no gate. Both are checked here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # The link check below is the only weekly job. Without this trigger it was
    # reachable by hand only, so the "run weekly" it promises never happened and
    # link rot would have gone unnoticed for as long as nobody clicked the button.
    - cron: "17 4 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is installed whole, which is also the install path
          # both READMEs document, so a break in it surfaces here rather than on a
          # reader's machine. That pulls MOABB and MNE in as well, even though no
          # job here downloads a dataset: every test runs on the bundled toy data.
          pip install -r requirements.txt
          pip install pytest

      - name: Plug-in and guard coverage (fast)
        run: pytest hustbciml/tests/test_plugins.py hustbciml/tests/repro -q

      - name: Integration smoke on bundled toy data
        run: pytest hustbciml/tests/test_smoke.py -q

  generated-artifacts:
    # The site data under docs/data/ and the cards under hustbciml/docs/cards/ are
    # generated. If a YAML source changes and the generator is not re-run, the
    # public page and the committed source disagree — which is exactly how ten
    # stale card values reached the repository unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyyaml

      - name: Regenerate the site data and the cards
        run: |
          python gallery/build_site.py
          python -m hustbciml.scripts.build_cards

      - name: Fail if the generated files are out of date
        run: |
          if ! git diff --quiet; then
            echo "::error::generated files are stale — re-run gallery/build_site.py and"
            echo "::error::python -m hustbciml.scripts.build_cards, then commit the result."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "generated files are in sync with their YAML sources"

      - name: Chinese layer resolves
        # A tr() string whose English was edited without updating its i18n key
        # falls back to English and renders exactly like a translation, so only a
        # reader of the Chinese page ever notices. Cheap to check, invisible
        # otherwise.
        run: python gallery/check_i18n.py

  links:
    # Link rot on a paper-to-code gallery is silent: the page keeps rendering.
    # Run weekly rather than on every commit so a publisher outage does not block
    # a merge, and warn rather than fail on redirects.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python gallery/check_links.py --timeout 20
