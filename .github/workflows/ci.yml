name: CI

# Three gates, in order of how quickly a break in them would otherwise reach a
# reader: the test suite, the generated files, and the gallery's outbound links.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday 04:17 UTC, for the link check only — it is the one job that depends on
    # the outside world rather than on this repository.
    - cron: "17 4 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Both commands are what the READMEs document, run whole, so a break in
          # either surfaces here rather than on a reader's machine. requirements.txt
          # pulls MOABB and MNE in as well, even though no job here downloads a
          # dataset: every test runs on the bundled toy data.
          pip install -r requirements.txt
          pip install -e .
          pip install pytest

      - name: Plug-in and guard coverage (fast)
        run: pytest src/hustbciml/tests/test_plugins.py src/hustbciml/tests/repro -q

      - name: Integration smoke on bundled toy data
        run: pytest src/hustbciml/tests/test_smoke.py -q

  generated-artifacts:
    # The site data under docs/data/ and the cards under src/hustbciml/docs/cards/
    # are generated from YAML. This job regenerates both and fails if the result
    # differs from what is committed, so the public page cannot disagree with the
    # source it is built from.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The card generator needs nothing but PyYAML; --no-deps installs the package
      # for its import path alone and keeps this job seconds rather than minutes.
      - run: |
          pip install pyyaml
          pip install -e . --no-deps

      - name: Regenerate the site data and the cards
        run: |
          python gallery/build_site.py
          python -m hustbciml.scripts.build_cards

      - name: Fail if the generated files are out of date
        run: |
          if ! git diff --quiet; then
            echo "::error::generated files are stale — re-run gallery/build_site.py and"
            echo "::error::python -m hustbciml.scripts.build_cards, then commit the result."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "generated files are in sync with their YAML sources"

      - name: Chinese layer resolves
        # A tr() string whose English was edited without updating its i18n key
        # falls back to English and renders exactly like a translation, so only a
        # reader of the Chinese page would ever notice.
        run: python gallery/check_i18n.py

  links:
    # Link rot on a paper-to-code gallery is silent: the page keeps rendering.
    # Weekly rather than per-commit, so a publisher outage does not block a merge,
    # and redirects warn rather than fail.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python gallery/check_links.py --timeout 20
